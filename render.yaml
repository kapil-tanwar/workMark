{
  "$schema": "https://openapi.render.com/schema/render.yaml.json",
  "services": [
    {
      "type": "web",
      "name": "workflow-hr-api",
      "runtime": "node",
      "rootDir": "backend",
      "plan": "free",
      "buildCommand": "npm install",
      "startCommand": "npm start",
      "healthCheckPath": "/health",
      "envVars": [
        {
          "key": "NODE_ENV",
          "value": "production"
        },
        {
          "key": "JWT_SECRET",
          "generateValue": true
        },
        {
          "key": "JWT_EXPIRES_IN",
          "value": "7d"
        },
        {
          "key": "MONGODB_URI",
          "sync": false
        },
        {
          "key": "CORS_ORIGIN",
          "sync": false
        }
      ]
    }
  ]
}
